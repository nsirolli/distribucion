upstream distribucion_server {
    server web:8000;
}

server {
    listen 8000 default_server;
    listen [::]:8000;
    
    # Apache se encarga del ServerName, pero puedes dejarlo genérico
    server_name distribucion.dm.uba.ar;

    # Redirección de horarios a materias
    rewrite /horarios/(.*) /materias/$1 ;

    # Peticiones dinámicas al backend (Gunicorn/Django)
    location / {
        proxy_pass http://distribucion_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Importante: para que la app sepa que la conexión original cliente-Apache fue HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Ubicación específica que tenías definida
    location ~ /materias/([0-9V]*)$ {
        proxy_pass http://distribucion_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Archivos estáticos
    location /static/ {
        alias /codigo/distribucion/static/;
    }

    # Archivos multimedia subidos
    location /media/ {
        alias /codigo/distribucion/media/;
    }
}
