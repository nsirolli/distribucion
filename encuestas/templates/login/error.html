{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="alert alert-danger" role="alert">
                            <h4 class="alert-heading">¡Acceso no autorizado!</h4>
                            <p class="mb-0">
                                Ingresá desde la URL de la encuesta que querés completar.
                            </p>
                        </div>
                        
                        <div class="my-4">
                            <p class="text-muted">
								Para acceder al sistema de encuestas, debés
								hacerlo a través del enlace específico que te
								fue proporcionado.
                            </p>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.min-vh-75 {
    min-height: 75vh;
}

.card {
    border: none;
    border-radius: 15px;
}

.btn-lg {
    padding: 0.75rem 1.5rem;
    font-size: 1.1rem;
    border-radius: 10px;
}

.alert {
    border-radius: 10px;
}
</style>

<!-- Incluir FontAwesome para los íconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
